<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Register for a student club event.">
  <title>Club Events - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">Club Events</a>
    <nav aria-label="Main menu">
      <a href="index.html">Events</a>
      <a href="index.html#about">About</a>
      <a href="register.html" aria-current="page">Join</a>
    </nav>
  </header>

  <main>
    <h1>Register for an event</h1>
    <p class="intro">Fill in the form to save your seat.</p>

    <!-- shown after the form is sent (see .message:target in style.css) -->
    <p id="registered" class="message">Your registration has been created.</p>

    <form action="#registered">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="event">Event</label>
      <select id="event" name="event" required>
        <option value="">-- Choose an event --</option>
        <option value="robotics">Robotics Workshop (Oct 23)</option>
        <option value="cv">CV Writing Workshop (Oct 26)</option>
        <option value="concert">Republic Day Concert (Oct 29)</option>
        <option value="photo">Photography Walk (Oct 31)</option>
        <option value="hackathon">Hackathon Info Session (Nov 3)</option>
        <option value="games">Board Game Night (Nov 5)</option>
      </select>

      <label for="seats">Seats</label>
      <input id="seats" name="seats" type="number" min="1" max="5" value="1" required>

      <button type="submit">Register</button>
    </form>
  </main>

  <footer>
    <p>Team: Hamza Talha Koşak, Enes Kaan Duran, Bedirhan Bayır</p>
    <p>MIS 457 · Fall 2026</p>
  </footer>
</body>
</html>
