<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Register for a student club event.">
  <title>Club Events - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">Club Events</a>
    <nav aria-label="Main menu">
      <a href="index.html">Events</a>
      <a href="index.html#about">About</a>
      <a href="register.html" aria-current="page">Join</a>
    </nav>
  </header>

  <main>
    <h1>Register for an event</h1>
    <p class="intro">Fill in the form to save your seat.</p>

    <!-- register.js writes the success message here -->
    <p id="message" class="message" role="status"></p>

    <!-- novalidate: register.js checks the fields and shows our own error messages -->
    <form id="register-form" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required aria-describedby="name-error">
      <p id="name-error" class="error"></p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required aria-describedby="email-error">
      <p id="email-error" class="error"></p>

      <label for="event">Event</label>
      <select id="event" name="event" required aria-describedby="event-error">
        <option value="">-- Choose an event --</option>
        <option value="1">Robotics Workshop (Oct 23)</option>
        <option value="2">CV Writing Workshop (Oct 26)</option>
        <option value="3">Republic Day Concert (Oct 29)</option>
        <option value="4">Photography Walk (Oct 31)</option>
        <option value="5">Hackathon Info Session (Nov 3)</option>
        <option value="6">Board Game Night (Nov 5)</option>
      </select>
      <p id="event-error" class="error"></p>

      <label for="seats">Seats</label>
      <input id="seats" name="seats" type="number" min="1" max="5" value="1" required aria-describedby="seats-error">
      <p id="seats-error" class="error"></p>

      <button type="submit">Register</button>
    </form>
  </main>

  <footer>
    <p>Team: Hamza Talha Koşak, Enes Kaan Duran, Bedirhan Bayır</p>
    <p>MIS 457 · Fall 2026</p>
  </footer>

  <script src="register.js"></script>
</body>
</html>
